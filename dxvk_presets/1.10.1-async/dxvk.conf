# Gothic 3 Optima - DXVK 1.10.1-async Configuration
# Older version. Use if you have an Intel GPU or newer versions cause issues.
dxvk.enableAsync = true
dxvk.numCompilerThreads = 8
d3d9.maxFrameLatency = 1
d3d9.samplerAnisotropy = 16
d3d9.deferSurfaceCreation = True
d3d9.memoryTrackTest = False
d3d9.tearFree = False
dxvk.logLevel = info
