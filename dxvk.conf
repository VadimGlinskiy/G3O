# Gothic 3 Optima - DXVK High-Performance Configuration
# Translates D3D9 to Vulkan, moves textures/geometry into GPU VRAM

# Multithreaded shader compilation and pipelines
dxvk.numCompilerThreads = 8
dxvk.enableGraphicsPipelineLibrary = True
dxvk.trackPipelines = True

# Input latency and frame presentation
d3d9.maxFrameLatency = 1
d3d9.deferSurfaceCreation = True
d3d9.tearFree = False

# Texture and sampler enhancements
d3d9.samplerAnisotropy = 16
d3d9.seamlessCubes = True
d3d9.invariantPosition = True

# Memory optimization
d3d9.memoryTrackTest = False

# Logging (HUD can be enabled via DXVK_HUD=fps,memory,devinfo)
dxvk.logLevel = info
