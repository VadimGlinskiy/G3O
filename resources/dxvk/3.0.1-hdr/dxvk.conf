# Gothic 3 Optima - DXVK 3.0.1 HDR Configuration
# DXVK 3.0.1 with HDR output (Requires HDR-capable monitor & Windows HDR enabled).
dxvk.numCompilerThreads = 8
dxvk.enableGraphicsPipelineLibrary = True
dxvk.trackPipelines = True
d3d9.maxFrameLatency = 1
d3d9.samplerAnisotropy = 16
d3d9.deferSurfaceCreation = True
d3d9.memoryTrackTest = False
d3d9.seamlessCubes = True
d3d9.invariantPosition = True
d3d9.tearFree = False
dxvk.enableHDR = True
d3d9.enableHDR = True
dxgi.enableHDR = True
dxvk.logLevel = info
