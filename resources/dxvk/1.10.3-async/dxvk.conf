# Gothic 3 Optima - DXVK 1.10.3-async Configuration
# Older version. Use if your GPU lacks Vulkan 1.3 support or has issues with DXVK 2.0.
dxvk.enableAsync = true
dxvk.numCompilerThreads = 8
d3d9.maxFrameLatency = 1
d3d9.samplerAnisotropy = 16
d3d9.deferSurfaceCreation = True
d3d9.memoryTrackTest = False
d3d9.seamlessCubes = True
d3d9.tearFree = False
dxvk.logLevel = info
