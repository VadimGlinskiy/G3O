; ==============================================================================
; Gothic 3 Optima (G3O)
; Конфигурационный файл. Располагается в папке с игрой рядом с Gothic3.exe.
; Значения параметров: true — включено, false — выключено.
; Логи, отчеты об ошибках и дампы памяти сохраняются в папку Gothic 3\G3O\.
; ==============================================================================

[General]
; Главный выключатель G3O.
; При false все хуки и оптимизации отключаются, игра работает как оригинал.
EnableG3O=true

; Загрузка скриптовых плагинов из папки Data\G3SE\Plugins через установленный G3SE/G3SDK.
; Если вы используете моды с кастомными скриптами — оставьте true.
LoadG3SEPlugins=true

; Автоматическая загрузка графического пакета ReShade (ReShade32.dll), если файл находится в папке с игрой.
; Позволяет использовать шейдеры постобработки без переименования системных библиотек.
LoadReShade=true

; Исправление конфликтов с оверлеями (например, Bandicam).
; Отключает проблемный Vulkan-слой, из-за которого игра может падать при запуске с DXVK.
FixVulkanLayerConflicts=true


[Display]
; Режим окна без рамки (Borderless Fullscreen).
; Позволяет комфортно играть на весь экран с быстрым сворачиванием через Alt+Tab без вылетов и черных экранов.
EnableBorderless=true

; Автоматически переводить игру в безрамочный полноэкранный режим при запуске.
AutoBorderless=true

; В безрамочном режиме не дает игре сворачиваться при потере фокуса (например, при клике на второй монитор).
PreventMinimizeOnFocusLoss=true

; Блокировка курсора мыши внутри окна игры (true / false).
; В полноэкранном окне не позволяет курсору случайно вылетать за границы монитора на второй экран.
; При сворачивании через Alt+Tab или потере фокуса курсор мгновенно освобождается.
WindowCursorLock=true

; Проброс мультимедийных клавиш клавиатуры (true / false).
; Разрешает работу кнопок регулировки громкости, отключения звука и переключения треков (Play/Pause) прямо во время игры.
InputSystemKeyPassthrough=true


[CrashInvestigator]
; Система диагностики и перехвата вылетов.
; Отслеживает критические сбои и сохраняет подробную информацию о причине в папку G3O\.
EnableCrashInvestigator=true

; Защита от сбоев при поврежденных объектах (Crash Guards).
; Перехватывает вызовы функций движка с нулевыми указателями (DrawFocusName без актера, кости GetBoneMatrix в регдоллах, FindStack с null-шаблоном)
; и безопасно пропускает их вместо вылета с ошибкой «Where is the guru?» или Access Violation.
EnableCrashGuards=true

; Показ информативного окна при вылете игры.
; Показывает понятный диалог в случае необработанного Win32-исключения с указанием модуля и адреса сбоя.
ShowCrashDialog=true

; Создание минидампа памяти (.dmp) при падении.
; Записывает состояние памяти для отладки вылета или внутренней ошибки FatalError движка.
WriteCrashDump=true

; Сохранять подробный текстовый отчет об ошибке в папку G3O\, если сбой удалось перехватить.
WriteCrashLog=true


[Performance]
; Ускорение базовых математических операций и работы со строками движка (SharedBase.dll).
; Использует быстрые инструкции процессора для проверки границ объектов и сравнения имен в памяти.
; Заметно снижает нагрузку на CPU в сценах с большим количеством объектов и ускоряет загрузку мира.
EnableSharedBaseOptimizations=true

; Оптимизация поиска компонентов внутри игровых объектов.
; Когда список компонентов отсортирован, находит нужные данные мгновенно без перебора всего списка.
EnableEntitySearchOptimizer=true

; Быстрая распаковка архивов PAK и сохранений через современную библиотеку libdeflate (AVX2).
; Значительно ускоряет загрузку игры. При сбое пробует аварийную распаковку без проверки контрольной суммы zlib, а затем штатный метод.
EnableFastPakDecompressor=true

; Кольцевой буфер предзагрузки слоев мира для тяжелых модов (RB_Mod).
; Данные берутся только при полном совпадении сжатого блока с файлом архива. Требует EnableFastPakDecompressor=true.
; Для обычной игры держите выключенным (EnableLayerRingArena=false).
EnableLayerRingArena=false

; Кэширование свойств объектов при загрузке.
; Запоминает однажды найденные свойства в быстрой хэш-таблице, избавляя от повторных поисков и ускоряя загрузку сохранений.
EnablePropertyCache=true

; Фоновое чтение и предзагрузка архивов.
; В фоне прогревает файловый кэш Windows перед стартом мира и заранее распаковывает отмеченные PAK-блоки по данным прошлой загрузки.
; Устраняет зависания и микрофризы при входе в игру.
EnablePakPrefetch=true

; Максимальный объем оперативной памяти под кэш распакованных архивов (в мегабайтах).
; 768 МБ — оптимальный безопасный лимит для 32-битного движка Готики 3 (предотвращает вылеты Out of Memory). 0 выключает кэш.
PakCacheBudgetMB=384

; Количество фоновых потоков для распаковки ресурсов по трассе сохранения.
; 0 — определить автоматически по числу физических ядер процессора.
PakPrefetchWorkers=0

; Оптимизация базы видимости мира при загрузке.
; Откладывает частые мелкие перерасчеты и применяет их пачкой, сокращая время загрузочного экрана.
EnableFrustumDatabaseOptimizer=true

; Быстрый поиск шаблонов игровых сущностей по имени.
; Кэширует шаблоны в памяти, избавляя движок от долгого перебора списков при спавне NPC, монстров и предметов.
EnableHashProxyOptimizer=true

; Оптимизация навигации.
; Устраняет холостые накладные расходы при обработке путей перемещения NPC во время игры и загрузки.
EnableNavigationOptimizer=true

; Оптимизация работы с большими секторами мира.
; Когда массив дочерних узлов сцены заполнен и содержит не менее 64 элементов, заранее увеличивает вместимость до 1024, 8192 или 32768.
; Предотвращает миллионы повторных выделений памяти при загрузке мира.
EnableSceneNodeOptimizer=true

; Оптимизация солнечных теней.
; Быстро удаляет дубликаты из списка источников тени без лишней перетасовки памяти, повышая FPS в лесистой местности.
EnableShadowOptimizer=true

; Кэширование фабрики классов.
; Запоминает соответствие имен классов внутренним типам движка, ускоряя распознавание объектов при загрузке.
EnableClassFactoryOptimizer=true

; Оптимизация поиска диалогов NPC.
; Мгновенно находит нужные реплики и условия через хэш-таблицу. Устраняет заикания при приближении к NPC и открытии диалогов.
EnableInfoManagerOptimizer=true

; Устранение холостых пауз при старте сессии.
; В оригинале движок делает 12 пауз Sleep по 100 мс (1.2 сек). Опция сокращает их до минимума.
EnableSessionStartOptimizer=true

; Длина паузы при старте сессии в миллисекундах (1 мс вместо 100 мс).
SessionStartSleepMs=1

; Быстрая загрузка текстур.
; Пропускает повторную фильтрацию для DDS-текстур с уже готовыми mip-уровнями, ускоряя подгрузку мира на лету.
EnableFastTextureLoader=true

; Оптимизация дальности прорисовки травы и теней от деревьев.
; Отсекает расчет теней от далеких невидимых крон, существенно повышая частоту кадров (FPS) на открытой местности.
EnableVegetationOptimizer=true

; Адаптивная дальность теней в зависимости от высоты дерева.
; Тени кустов отсекаются ближе, а тени гигантских деревьев видны дальше.
EnableAdaptiveTreeShadows=true

; Базовая дистанция отображения теней деревьев (в игровых единицах).
TreeShadowDistance=6500.0

; Ограничение радиуса сетки травы вокруг игрока (в игровых единицах, 0 = без ограничений).
VegetationGridRangeClamp=7500.0

; Умное отсечение мелких объектов (Selective Culling).
; Не рисует микроскопические камни, посуду и мелкий мусор вдалеке, но всегда сохраняет видимость врагов, NPC и сундуков. Повышает FPS.
EnableSelectiveCulling=true

; Порог отсечения для мелкого мусора и декораций (чем число больше, тем раньше они перестают нагружать видеокарту).
ClutterCullThreshold=0.008

; Порог видимости для важных объектов, NPC, врагов и лута (чем меньше, тем дальше они видны).
ImportantCullThreshold=0.002

; Управление атмосферным туманом.
; Позволяет отодвинуть горизонт тумана и открыть красивые виды на горы и море.
EnableAtmosphericFogControl=true

; Множитель дальности обычного погодного тумана (2.5 отодвигает туман в 2.5 раза дальше, открывая живописные панорамы).
FogDistanceMultiplier=2.5

; Минимальная дистанция окончания тумана в ясную погоду.
FogEndMinDistance=250000.0

; Сохранять оригинальный близкий туман под водой, в пещерах и ядовитом газе, чтобы не нарушать атмосферу.
PreserveUnderwaterFog=true

; Запрос высокоточного системного таймера Windows (1 мс) для более плавного отсчета времени кадров.
EnableHighPrecisionTimer=true

; Высокий приоритет процесса Gothic3.exe в Windows. Защищает игру от подтормаживаний из-за фоновых программ.
EnableHighProcessPriority=true

; Привязка игры к производительным ядрам процессора.
; На гибридных процессорах (Intel 12+ поколений) игра запускается на ядрах с наивысшим классом производительности Windows.
; Выбирает по одному логическому процессору с каждого ядра, избегая медленных энергоэффективных E-ядер.
EnableCPUTopologyAffinity=true

; Кэширование путей к файлам в виртуальной файловой системе (VFS).
; Мгновенно находит нужные архивы и файлы модов без повторного сканирования диска.
EnableVFSCache=true

; Количество используемых физических ядер процессора (0 = автоматически).
CPUCores=0

; Количество логических потоков процессора (0 = автоматически).
CPUThreads=0

; Ручная шестнадцатеричная маска привязки ядер процессора (0x0 = автоматически).
CPUAffinityMask=0x0

; Фильтр повторяющихся команд DirectX 9.
; Отсекает отправку видеокарте идентичных состояний рендеринга, экономя процессорное время.
EnableD3D9StateFilter=true


[Memory]
; Режим высокопроизводительного менеджера кучи mimalloc (0, 1, 2).
; 0 = Стандартный аллокатор движка (максимальная совместимость).
; 1 = Замена ShortUsage / ScrapHeap (ускоряет покадровые временные буферы без риска межмодульных конфликтов).
; 2 = Полная замена MemHeap и bCMemoryAdmin с Safe Dispatch Free (максимальная скорость и снижение фрагментации VAS).
AllocatorMode=0


[Logging]
; Запись подробного журнала работы G3O в файл G3O\G3O_diagnostic_*.log (для обычной игры держите false).
EnableDiagnosticLog=false

; Перехват отладочных сообщений игры и плагинов в лог G3O.
InterceptOutputDebugString=false

; Профилировщик производительности: раз в секунду записывает FPS, время кадров и загрузку CPU.
EnableProfiler=false

; Запись времени этапов загрузки сохранения в лог G3O\G3O_LoadProfiler_*.log.
EnableSavegameAudit=false

; Дополнительный замер времени загрузки слоев мира и чтения свойств (работает вместе с EnableSavegameAudit).
EnableLayerAudit=false
