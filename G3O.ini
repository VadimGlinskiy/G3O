; ==============================================================================
; Gothic 3 Optima (G3O)
; Меняй значения после "=". Текст после ";" объясняет настройку; true — включено,
; false — выключено.
;
; ==============================================================================


[General]
; Включает игровые функции G3O. При false игровые хуки не ставятся, но DLL остаётся
; загруженной для работы с вводом.
EnableG3O=true

; Загружает плагины из Data\G3SE\Plugins через установленный G3SE/G3SDK. На скорость
; влияют сами плагины, а не этот переключатель.
LoadG3SEPlugins=true

; Не даёт Bandicam подключать свой Vulkan-слой к Gothic 3. Включай, если из-за него
; игра не запускается с Vulkan/DXVK.
FixVulkanLayerConflicts=true


[Display]
; Разрешает безрамочный режим на весь экран при запуске игры.
EnableBorderless=true

; Запускает игру в полноэкранном окне без рамки при старте.
AutoBorderless=true

; В безрамочном режиме не даёт игре сворачиваться, когда ты переключаешься на другое
; окно.
PreventMinimizeOnFocusLoss=true


[CrashInvestigator]
; Собирает данные о системном сбое или внутренней ошибке игры, чтобы можно было
; найти причину вылета. Сам вылет не предотвращает.
EnableCrashInvestigator=true

; Показывает окно с сообщением при системном сбое Windows. При внутренней ошибке
; FatalError отчёт создаётся без отдельного окна.
ShowCrashDialog=true

; При сбое сохраняет файл с данными памяти Gothic 3. Он помогает разработчику
; разобраться, почему игра вылетела.
WriteCrashDump=true

; Сохраняет текстовый отчёт об ошибке, если G3O успел её обработать.
WriteCrashLog=true


[Performance]
; Ускоряет частые проверки пересечения границ объектов и сравнения текста. Это
; уменьшает работу процессора при обработке мира и загрузке; может помочь, если игра
; упирается в CPU.
EnableSharedBaseOptimizations=true

; Быстрее находит нужный тип данных внутри объекта, когда список уже отсортирован.
; Если список изменился, игра использует обычный поиск. Меньше работы CPU при
; загрузке и создании объектов.
EnableEntitySearchOptimizer=true

; Быстрее распаковывает игровые архивы и данные сохранений. Сокращает ожидание,
; когда загрузка упирается именно в распаковку.
EnableFastPakDecompressor=true

; Заранее распаковывает блоки слоёв RB_Mod в оперативную память, чтобы при загрузке
; брать их готовыми. Кэш хранит ресурсы, не прогресс сохранения; если блок не готов
; или не совпадает с архивом, игра распакует его обычным способом. Требует
; EnableFastPakDecompressor=true.
EnableLayerRingArena=false

; При загрузке сохранения запоминает результаты поиска свойств объектов. Повторный
; запрос берёт готовый результат, а не запускает поиск заново.
EnablePropertyCache=true

; В фоне читает игровые архивы. Если для сохранения есть список ресурсов из прошлой
; загрузки и включён быстрый распаковщик, нужные блоки заранее распаковываются в
; память. Список содержит ресурсы, не прогресс игры.
EnablePakPrefetch=true

; Сколько оперативной памяти можно занять распакованными блоками архивов. 0
; выключает этот кэш; фоновое чтение архивов при этом может продолжаться.
PakCacheBudgetMB=768

; Сколько фоновых потоков распаковывают ресурсы по трассе. 0 — выбрать число
; автоматически; больше потоков быстрее подготовят данные, но сильнее займут
; процессор.
PakPrefetchWorkers=0

; При загрузке мира собирает обновления списка видимых объектов и применяет их
; пачкой. Так игра тратит меньше времени на повторную обработку этого списка;
; дальность показа не меняется.
EnableFrustumDatabaseOptimizer=true

; Ускоряет поиск игровых шаблонов по имени и запоминает найденные результаты. При
; повторном запросе игре не приходится заново проходить длинный список объектов.
EnableHashProxyOptimizer=true

; Безопасный режим: устраняет накладные расходы от перехвата навигации во время игры.
EnableNavigationOptimizer=true

; При загрузке больших секторов заранее выделяет место для списка объектов крупными
; блоками. Так игре реже приходится перестраивать и копировать этот список.
EnableSceneNodeOptimizer=true

; Ускоряет обновление списка объектов, отбрасывающих тени: убирает повторы и быстрее
; удаляет записи. Может помочь FPS в сценах с большим числом теней; сами тени не
; меняет.
EnableShadowOptimizer=true

; Запоминает результаты поиска типов объектов. Когда игре снова нужен тот же тип,
; она берёт готовый результат вместо нового поиска; это сокращает работу при
; загрузке мира.
EnableClassFactoryOptimizer=true

; При загрузке сначала рассчитывает видимость для меньшей области, пропускает почти
; одинаковые расчёты и постепенно расширяет область. Это может ускорить вход в мир;
; дальние участки будут готовы позже.
EnablePVSPrefetchOptimizer=false

; На время загрузки уменьшает радиус, в котором игра активирует объекты, а затем
; возвращает исходный. Может ускорить начальную загрузку, но дальние NPC появятся в
; работе позже. Используется вместе с EnablePVSPrefetchOptimizer, когда
; EnableDynamicROI выключен.
EnableAdaptiveROI=true

; Начальный радиус активности объектов при загрузке. Меньший радиус уменьшает
; начальную работу, но дальние объекты активируются позже; единицы те же, что в
; ge3.ini.
ROIBootRadius=3600

; Начальный радиус, для которого игра рассчитывает видимость мира. Меньше радиус —
; меньше работы в начале загрузки, но дальние участки подготовятся позже.
PVSBootRadius=3800

; Если центр и радиус нового расчёта изменились меньше этого значения, запрос
; считается повтором и пропускается. Больше значение — чаще пропускаются похожие
; запросы.
PVSRedundantDistance=200

; За сколько следующих расчётов расширить область от начального радиуса до обычного.
; 0 отключает постепенное расширение.
PVSRampUpCalls=24


; Создаёт индекс записей диалогов, чтобы быстрее находить нужные реплики и условия
; NPC. При первом обращении индекс строится, зато следующие поиски занимают меньше
; времени.
EnableInfoManagerOptimizer=true

; Укорачивает 12 пауз по 100 мс, которые игра делает при запуске мира. Новую длину
; задаёт SessionStartSleepMs; после загрузки настройка на FPS не влияет.
EnableSessionStartOptimizer=true

; Длительность паузы при запуске мира в миллисекундах. 0 убирает ожидание, большее
; число задерживает запуск дольше.
SessionStartSleepMs=1

; Меняет радиус, в котором игра обновляет объекты: когда прицел виден — AimingROI,
; когда скрыт — BaseROI. Меньший радиус снижает работу CPU, но дальние NPC
; обновляются иначе. Прицел может быть виден и без наведённой цели.
EnableDynamicROI=false

; Радиус активности объектов, когда прицел скрыт. 0 оставляет значение игры; меньший
; радиус снижает работу CPU, но дальние объекты обновляются реже.
BaseROI=0

; Радиус активности объектов, когда прицел виден. 0 берёт BaseROI; больший радиус
; оставляет активными объекты дальше от игрока.
AimingROI=7500

; При загрузке текстур не пересчитывает готовые уменьшенные копии, а для остальных
; использует более простой фильтр. Это может ускорить загрузку; некоторые текстуры
; могут выглядеть немного иначе.
EnableFastTextureLoader=true

; Ограничивает дальность теней деревьев и расчёта травы, а не дальность самих
; деревьев. Это может снизить нагрузку и поднять FPS; дальняя трава и тени будут
; исчезать раньше.
EnableVegetationOptimizer=true

; Сокращает дальность теней кустов и увеличивает её для очень высоких деревьев
; относительно TreeShadowDistance. Меняет вид теней и объём работы с ними.
EnableAdaptiveTreeShadows=true

; Как далеко видны тени деревьев. 0 отключает их отрисовку; большее значение
; показывает тени дальше, но увеличивает нагрузку.
TreeShadowDistance=6500.0

; Максимальное расстояние расчёта травы. Меньшее значение снижает нагрузку, но трава
; вдали исчезает; 0 снимает ограничение.
VegetationGridRangeClamp=7500.0

; Перестаёт рисовать слишком мелкие на экране объекты. Для декора и важных объектов
; действуют разные пороги; это может повысить FPS, но некоторые предметы будут
; исчезать раньше. Из мира они не удаляются.
EnableSelectiveCulling=true

; Порог для мелкого декора: чашек, камней и обломков. Чем число больше, тем раньше
; игра перестаёт их рисовать; это не расстояние в метрах.
ClutterCullThreshold=0.008

; Порог для NPC, деревьев, предметов, света и интерактивных объектов. Чем число
; меньше, тем дальше они остаются видимыми; это не расстояние в метрах.
ImportantCullThreshold=0.002

; Позволяет менять дальность обычного погодного тумана. Дальше туман — больше мира
; видно; в тяжёлых сценах это может снизить FPS.
EnableAtmosphericFogControl=true

; Умножает обычную дальность тумана: больше 1 отодвигает его, меньше 1 приближает.
; Например, 2.0 примерно удваивает дальность.
FogDistanceMultiplier=2.5

; Не позволяет обычному туману закончиться ближе указанного расстояния. 0 выключает
; ограничение; в очень плохую погоду густой туман сохраняется.
FogEndMinDistance=250000.0

; Оставляет короткий туман под водой, в пещерах и ядовитом газе на расстоянии,
; заданном игрой. При false на него тоже действует FogDistanceMultiplier.
PreserveUnderwaterFog=true

; Экспериментальный глобальный LOD-хук. Он влияет на все визуальные меши, не только море.
; Оставляй выключенным вне теста; масштаб 0.25–4.0, 1.0 ничего не меняет.
EnableGlobalVisualLodProbe=false
GlobalVisualLodProbeScale=1.25

; Просит Windows установить интервал системного таймера в 1 мс, пока работает G3O.
; Короткие паузы отмеряются точнее, но загрузка и FPS сами по себе быстрее не
; становятся.
EnableHighPrecisionTimer=true

; Просит Windows чаще выделять Gothic 3 время процессора, когда его делят с другими
; программами. Может помочь при нехватке CPU, но фоновые программы могут работать
; медленнее.
EnableHighProcessPriority=true

; Закрепляет игру за выбранными процессорными ядрами; на гибридных CPU G3O старается
; использовать более быстрые. Может помочь или замедлить игру. Ограничение действует
; и на потоки PUP.
EnableCPUTopologyAffinity=true

; Запоминает, где игра нашла файл, чтобы при следующем поиске не перебирать папки и
; архивы заново. Содержимое файлов не кэширует; помогает только повторному поиску.
EnableVFSCache=true

; Сколько физических ядер разрешить игре. 0 — выбрать автоматически; настройка
; действует только при EnableCPUTopologyAffinity=true.
CPUCores=0

; Сколько логических процессоров разрешить игре. 0 — автоматически; слишком
; маленькое число может снизить производительность. При заданной CPUAffinityMask
; этот параметр не используется.
CPUThreads=0

; Ручной выбор процессоров в шестнадцатеричном виде: 0x1 — первый, 0x3 — первые два.
; 0x0 оставляет выбор автоматике.
CPUAffinityMask=0x0

; Не отправляет видеодрайверу одну и ту же команду настройки графики повторно. Может
; освободить время CPU и поднять FPS, если игра часто повторяет такие команды; при
; артефактах выключи.
EnableD3D9StateFilter=true


[Logging]
; Записывает настройки и сообщения G3O в файл G3O\G3O_diagnostic_*.log. При
; неполадках этот журнал помогает найти причину.
EnableDiagnosticLog=false

; Добавляет диагностические сообщения игры и плагинов в журнал G3O, чтобы они не
; потерялись после запуска.
InterceptOutputDebugString=false

; Записывает FPS, время кадров, нагрузку CPU и чтение файлов. Используй, чтобы найти
; источник тормозов; сам профайлер игру не ускоряет и может немного повлиять на
; замер.
EnableProfiler=false

; Записывает время этапов загрузки сохранения, мира и секторов в
; G3O\G3O_LoadProfiler_*.log. Помогает увидеть, на каком этапе игра ждёт.
EnableSavegameAudit=false

; Добавляет к отчёту загрузки замеры по слоям мира и чтению свойств объектов.
; Работает вместе с EnableSavegameAudit.
EnableLayerAudit=false
