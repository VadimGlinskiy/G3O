; ==============================================================================
; Gothic 3 Optima (G3O)
; Файл конфигурации. Располагается рядом с Gothic3.exe.
; Логи, отчеты о сбоях и дампы памяти сохраняются в папку Gothic 3\G3O\.
; ==============================================================================

[General]
; Главный переключатель мода (true / false).
; Что делает: при false отключает установку всех хуков и оптимизаций G3O.
; Что дает: позволяет мгновенно вернуть чистое поведение игры без удаления dinput8.dll.
EnableG3O=true

; Отображение водяного знака в главном меню (true / false).
; Что делает: рисует строку с версией G3O в левом нижнем углу меню.
; Что дает: визуальное подтверждение того, что мод успешно загружен в процесс.
ShowWatermark=true

; Загрузка внешних плагинов Script Extender (true / false).
; Что делает: сканирует каталог Data\G3SE\Plugins и загружает найденные DLL.
; Что дает: работу модов на базе G3SE без необходимости ставить отдельный инжектор.
LoadG3SEPlugins=true

; Устранение конфликтов Vulkan-слоев (true / false).
; Что делает: блокирует перехватчики сторонних программ (например, оверлей Bandicam) при запуске через DXVK.
; Что дает: предотвращает падения видеодрайвера и вылеты при старте игры.
FixVulkanLayerConflicts=true


[Display]
; Режим окна без рамок / Borderless Windowed (true / false).
; Что делает: убирает системную рамку окна и растягивает его на весь экран.
; Что дает: моментальный Alt-Tab без зависаний, мерцания экрана и сброса разрешения.
EnableBorderless=true

; Клавиша ручного переключения режима окна без рамок.
; Что делает: переключает режим отображения прямо во время игры.
; Что дает: возможность на лету сменить видеорежим (F1-F12, INSERT, DELETE, HOME, END, NONE).
ToggleBorderlessKey=F10

; Автоматический запуск в окне без рамок (true / false).
; Что делает: переводит игру в полноэкранное окно при старте, если в игре задан оконный режим.
; Что дает: не требует нажимать клавишу переключения при каждом запуске.
AutoBorderless=true

; Запрет сворачивания при потере фокуса (true / false).
; Что делает: блокирует реакцию окна на клики вне игры (на втором мониторе или в других окнах).
; Что дает: игра не сворачивается и не заикается, изображение и звук продолжают работать.
PreventMinimizeOnFocusLoss=true


[Camera]
; Динамическая коррекция угла обзора / FOV (true / false).
; Что делает: пересчитывает вертикальный угол камеры под пропорции экрана (16:9, 21:9, 32:9).
; Что дает: исправляет сплющенную перспективу и эффект «рыбьего глаза» на широких мониторах.
EnableDynamicFOV=true

; Базовый угол обзора камеры в градусах.
; Что делает: задает исходный FOV для камеры главного героя (в ваниле ~67°).
; Что дает: комфортный обзор мира без искажения геометрии по краям (рекомендуется 80–90°).
DefaultFOV=85.0

; Горячие клавиши регулировки FOV на лету (true / false).
; Что делает: включает обработку комбинаций клавиш для приближения/отдаления камеры.
; Что дает: оперативную подстройку масштаба прямо во время геймплея.
EnableFOVHotkeys=true

; Клавиша уменьшения FOV при зажатом Ctrl (дублируется на NumPad -).
; Что делает: приближает камеру к персонажу.
DecreaseFOVKey=[

; Клавиша увеличения FOV при зажатом Ctrl (дублируется на NumPad +).
; Что делает: отдаляет камеру от персонажа, расширяя угол обзора.
IncreaseFOVKey=]

; Шаг изменения FOV в градусах за одно нажатие горячей клавиши.
FOVStep=5.0


[CrashInvestigator]
; Перехватчик фатальных ошибок и сбоев (true / false).
; Что делает: регистрирует глобальный обработчик исключений Windows (SEH), перехватывает FatalError и Guru.
; Что дает: предотвращает бесследный вылет процесса, записывая отчет о причинах сбоя.
EnableCrashInvestigator=true

; Графическое окно ошибки при сбое (true / false).
; Что делает: показывает диалоговое окно для необработанного Win32-исключения с именем модуля и адресом (для FatalError используется движковый вывод).
; Что дает: позволяет сразу увидеть виновника падения (мод, движок или PhysX).
ShowCrashDialog=true

; Создание минидампа памяти (true / false).
; Что делает: сохраняет файл G3O_Crash_*.dmp в папке G3O\ при необработанном Win32-исключении (FatalError движка контекст дампа не предоставляет).
; Что дает: возможность открыть дамп в Visual Studio / WinDbg и изучить переменные и стек вызовов.
WriteCrashDump=true

; Запись текстового отчета о сбое (true / false).
; Что делает: сохраняет лог G3O_CrashReport_*.log с датой, состоянием регистров и стеком.
; Что дает: готовый отчет для локализации бага или отправки авторам модов.
WriteCrashLog=true


[Performance]
; Оптимизации математики и строк в SharedBase.dll (true / false).
; Что делает: заменяет скалярные проверки пересечения коробок AABB на SSE, ускоряет сравнение строк.
; Что дает: снижает нагрузку на CPU при отсечении невидимых объектов и сглаживает микрофризы.
EnableSharedBaseOptimizations=true

; Замена стандартного аллокатора MemHeap на mimalloc (true / false).
; Что делает: экспериментальный перехват кучи SharedBase.
; Что дает: выключено (false) из-за несовместимости с внутренними пулами SharedBase.dll и paru_s1.dll.
EnableMemoryAllocator=false

; Оптимизатор поиска компонентов сущностей (true / false).
; Что делает: кэширует указатели vptr таблиц в eCEntity::SearchForEntity с быстрым ранним выходом.
; Что дает: ускоряет на 30–40% поиск свойств и компонентов у NPC и предметов при высокой плотности объектов.
EnableEntitySearchOptimizer=true

; Аппаратный декомпрессор PAK и сохранений libdeflate (true / false).
; Что делает: заменяет скалярный zlib в FileSystem.dll и Game.dll на SIMD-декомпрессор (AVX2 + BMI2).
; Что дает: ускоряет распаковку модов и файлов сохранений более чем в 4 раза (с 9.2 с до 2.2 с).
EnableFastPakDecompressor=true

; Быстрый кэш свойств bCAccessorProperty::ResolveProperty (true / false).
; Что делает: плоский O(1) хэш-кэш для сопоставления идентификаторов свойств объекта.
; Что дает: 100% попаданий (1 000 000+ вызовов за загрузку), исключая холостой поиск в хеш-таблицах движка.
EnablePropertyCache=true

; Спекулятивный предраспаковщик PAK (true / false).
; Что делает: запускает фоновый пул потоков, заранее разжимающий блоки .pak по трассе предыдущих загрузок.
; Что дает: разжимает архивы параллельно в фоне до их запроса движком, срезая 4–8 секунд ожидания диска.
EnablePakPrefetch=true

; Лимит памяти кэша предварительной декомпрессии PAK в МБ (64–1024).
; Что делает: ограничивает размер буфера разжатых блоков в оперативной памяти.
; Что дает: предотвращает исчерпание 4 ГБ адресного пространства 32-битного процесса (рекомендуется 768 для 300+ модов).
PakCacheBudgetMB=768

; Число фоновых потоков предраспаковщика PAK (0 = автоматически).
; Что делает: задает количество рабочих потоков для параллельной декомпрессии блоков (до 6–8 ядер).
; Что дает: максимальную загрузку многоядерных процессоров во время экрана загрузки.
PakPrefetchWorkers=0

; Оптимизатор базы пространственной видимости сцены (true / false).
; Что делает: откладывает и пакетирует вызовы eCFrustumDatabase::ExtractFromEntity во время загрузки.
; Что дает: устраняет до 120 000+ холостых промежуточных перестроений базы видимости при спавне сущностей.
EnableFrustumDatabaseOptimizer=true

; Быстрое хэширование строк и кэш шаблонов eCTemplateEntityProxy (true / false).
; Что делает: заменяет хэш-функции строк на регистровый ассемблерный Fast DJB2 и кэширует шаблонные сущности.
; Что дает: снимает миллионы вызовов CRT-хэширования за загрузку и ускоряет поиск модовых шаблонов.
EnableHashProxyOptimizer=true

; Оптимизатор навигационного графа при загрузке (true / false).
; Что делает: глушит холостые тики gCNavigationAdmin::Process, пока идет загрузка сохранения.
; Что дает: отдает 100% времени CPU главному потоку на создание геометрии и объектов, исключая пустой поиск путей.
EnableNavigationOptimizer=true

; Экспоненциальное предвыделение узлов сцены eCNode::AttachChild (true / false).
; Что делает: заменяет медленный 25%-й рост массива детей на ступенчатое выделение (1024 -> 8192 -> 32768) через нативный Realloc.
; Что дает: полностью убирает 25–30 каскадных переаллокаций памяти на каждом крупном секторе (сектор RB_Mod быстрее на ~160 мс).
EnableSceneNodeOptimizer=true

; Оптимизатор теневых кастеров eCShadowMapDirectionalLightBase (true / false).
; Что делает: заменяет линейный поиск и memmove на O(1) Swap-and-Pop и хэш-индексацию.
; Что дает: ускоряет телепортацию камеры и спавн в GotoLoadedPosition на 5–8 секунд, убирает микрофризы теней в геймплее.
EnableShadowOptimizer=true

; Оптимизатор фабрики классов SharedBase bCPropertyObjectSingleton::ReadObject (true / false).
; Что делает: кэширует reflection-дескрипторы типов (L1 кэш) и заменяет Malloc/Free на Zero-Alloc переиспользование буфера bCString.
; Что дает: ускоряет десериализацию объектов SysDyn и кэшей на 3–5 секунд, исключает 60 000+ аллокаций памяти движка при загрузке.
EnableClassFactoryOptimizer=true

; Оптимизатор универсальных GUID-карт bTValMap<bCPropertyID, void*> (true / false).
; Что делает: заменяет стандартный поиск узлов в Engine.dll (RVA 0x1F0F20) на прямой инлайновый
; обход бакетов со сравнением 16 байт UUID без вызовов через границу DLL.
; Почему выключено по умолчанию (false):
; 1. Профилирование показало, что вызовы 0x1F0F20 не являются узким местом сектора SysDyn (6.47 с против 6.33 с).
; 2. Любые попытки внешнего кэширования сырых указателей на узлы в динамических ресурсных картах
;    (eCResourceAdmin) приводят к Use-After-Free сбоям при выгрузке/перезагрузке текстур в фоновых потоках.
; В коде оставлен полностью безопасный прямой обход бакетов, но по умолчанию опция отключена.
EnableGuidMapOptimizer=false

; Оптимизатор префетчера PVS eCPVSPrefetcher3 (true / false).
; Что делает: сжимает радиус синхронного спавна в GotoLoadedPosition до ближней зоны коллизий террейна,
; отсекает избыточные дублирующие синхронные прогоны и плавно догружает дальние ячейки после старта.
; Что дает: срезает 7–9 секунд с блокирующей фазы GotoLoadedPosition, исключая провалы сквозь землю.
EnablePVSPrefetchOptimizer=true

; Радиус сферы начального спавна PVS в GotoLoadedPosition (в см, по умолчанию 3800).
PVSBootRadius=3800

; Порог дедупликации повторных синхронных вызовов PVS в GotoLoadedPosition (в см, по умолчанию 200).
PVSRedundantDistance=200

; Количество кадров плавного расширения радиуса PVS до максимума после загрузки (по умолчанию 24).
PVSRampUpCalls=24

; Подавление фоновых квестовых проверок при загрузке (true / false).
; Что делает: блокирует вызовы HaveNPCsAllRequiredItems и HasImportantInfo во время экрана загрузки мира.
; Что дает: исключает бесполезный перебор всех квестов и инвентарей при добавлении каждого предмета во время спавна.
EnableQuestLoadOptimizer=true

; Оптимизатор поиска диалогов в gCInfoManager_PS (true / false).
; Что делает: заменяет 43-бакетный обход связных списков на плоскую теневую хэш-таблицу O(1).
; Что дает: сокращает фазу десериализации диалогов в SysDyn с 3.7 секунд до менее чем 5 миллисекунд.
EnableInfoManagerOptimizer=true
EnableInfoManagerBinaryCache=true

; Ускоритель загрузки текстур (true / false).
; Что делает: перехватывает загрузку текстур через Direct3D 9, пропуская избыточные промежуточные конвертации.
; Что дает: снижает заикания при фоновой подгрузке текстур в процессе перемещения по миру.
EnableFastTextureLoader=true

; Оптимизатор геометрии и теней растительности (true / false).
; Что делает: ограничивает предельную дистанцию расчета теней крон деревьев и радиус сетки плотной травы.
; Что дает: защищает от резких просадок FPS в густых лесах Миртаны и Нордмара.
EnableVegetationOptimizer=true

; Предельная дальность теней деревьев в игровых единицах (100 единиц = 1 метр).
; Что дает: 6500.0 (65 метров) сохраняет тени вокруг игрока, снижая нагрузку на CPU на дальних планах.
TreeShadowDistance=6500.0

; Предельный радиус сетки генерации травы в игровых единицах (0 = без ограничения).
; Что дает: 7500.0 (75 метров) защищает от переполнения буфера полигонов травы на максимальных настройках.
VegetationGridRangeClamp=7500.0

; Высокоточный системный таймер 1 мс (true / false).
; Что делает: вызывает timeBeginPeriod(1) на время работы процесса игры.
; Что дает: равномерное время кадра (Frame Pacing), стабильные тайминги потоков и снижение микрофризов.
EnableHighPrecisionTimer=true

; Высокий приоритет процесса игры (true / false).
; Что делает: выставляет процессу Gothic3.exe приоритет HIGH_PRIORITY_CLASS в Windows.
; Что дает: защищает игру от отбора квантов процессора фоновыми приложениями ОС.
EnableHighProcessPriority=true

; Привязка к производительным ядрам CPU (true / false).
; Что делает: анализирует архитектуру CPU и удерживает потоки игры на P-ядрах, избегая E-ядер (Intel) и медленных ядер.
; Что дает: максимальную вычислительную мощность для однопоточного рендера Genome Engine.
EnableCPUTopologyAffinity=true

; Кэширование путей в виртуальной файловой системе VFS (true / false).
; Что делает: сохраняет успешные пути к файлам в .pak архивах для быстрого повторного поиска.
; Что дает: сокращает накладные расходы при частых проверках наличия ресурсов в архивах.
EnableVFSCache=true

; Ручное ограничение числа физических ядер (0 = автоматически).
CPUCores=0

; Ручное ограничение числа логических потоков (0 = автоматически).
CPUThreads=0

; Явная шестнадцатеричная маска привязки ядер процессора (0 = автоматически).
CPUAffinityMask=0x0

; Фильтрация повторяющихся состояний Direct3D 9 (true / false).
; Что делает: пропускает повторные вызовы SetRenderState / SetTextureStageState / SetSamplerState.
; Что дает: на однопоточном устройстве пропускает повторы; при многопоточном режиме или неподдерживаемых state blocks отключается.
EnableD3D9StateFilter=true


[Logging]
; Запись подробного диагностического журнала (true / false).
; Что делает: создает G3O\G3O_diagnostic_*.log с фиксацией запуска всех хуков, модулей и параметров системы.
; Что дает: журнал запуска и работы оптимизаций; можно отключить, если подробный лог не нужен.
EnableDiagnosticLog=true

; Перехват системных сообщений OutputDebugStringA (true / false).
; Что делает: перенаправляет скрытый вывод движка и сторонних библиотек в лог G3O.
; Что дает: сбор полной информации об ошибках движка.
InterceptOutputDebugString=true

; Ежесекундный профилировщик производительности (true / false).
; Что делает: записывает в G3O\G3O_profile_*.log данные FPS, 1% Low, p99 времени кадра и нагрузку CPU.
; Что дает: детальный мониторинг плавности геймплея и поведения игры под нагрузкой.
EnableProfiler=true

; Высокоточный аудит загрузки сохранений (true / false).
; Что делает: сохраняет в G3O\G3O_LoadProfiler_*.log подробную разбивку времени загрузки сейва до миллисекунд.
; Что дает: точные замеры времени декомпрессии, чтения диска, спавна секторов и узлов сцены.
EnableSavegameAudit=true

; Глубокий микропрофайлинг слоев и свойств мира (true / false).
; Что делает: активирует 19 высокочастотных таймеров QPC на уровне отдельных сущностей и слоев.
; Что дает: инструмент разработчиков для поиска узких мест (добавляет ~0.2–0.3 с накладных расходов на загрузку).
EnableLayerAudit=true
